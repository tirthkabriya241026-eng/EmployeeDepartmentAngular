@if (dialog.isOpen()) {
  <div class="dialog-backdrop" (click)="dialog.cancel()">
    <div class="dialog-panel dialog-{{ dialog.config().type }}" (click)="$event.stopPropagation()">

      <div class="dialog-icon-wrap">
        @if (dialog.config().type === 'danger') {
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        }
        @if (dialog.config().type === 'warning') {
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 21h22L12 2 1 21zm12-3h-2v-2h2v2zm0-4h-2v-4h2v4z"/></svg>
        }
        @if (dialog.config().type === 'info') {
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
        }
      </div>

      <h3 class="dialog-title">{{ dialog.config().title }}</h3>
      <p class="dialog-message" [innerHTML]="dialog.config().message"></p>

      <div class="dialog-actions">
        <button class="dialog-btn-cancel" (click)="dialog.cancel()">
          {{ dialog.config().cancelText }}
        </button>
        <button class="dialog-btn-confirm dialog-confirm-{{ dialog.config().type }}" (click)="dialog.confirm()">
          {{ dialog.config().confirmText }}
        </button>
      </div>

    </div>
  </div>
}
